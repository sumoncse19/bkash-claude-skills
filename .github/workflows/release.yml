name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package-skill.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bkash-payment-gateway.zip
          generate_release_notes: true
